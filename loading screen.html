
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHRF — Loading</title>
    <link rel="stylesheet" href="css/loading-screen.css">
</head>

<body>

    <main class="loading-screen">

        <!-- Background -->
        <div class="background"></div>

        <div class="overlay"></div>

        <!-- Large background branding -->
        <div class="background-title">
            SHRF
        </div>

        <!-- Loading panel -->
        <section class="loading-panel">

            <!-- SHRF logo -->
            <div class="logo-wrapper">
                <img
                    src="images/shrf.jpg"
                    alt="SHRF"
                    class="logo"
                >
            </div>

            <div class="loading-text">
                Loading...
            </div>

            <div class="progress-container">

                <div class="progress-track">
                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>
                </div>

                <div
                    class="percentage"
                    id="percentage"
                >
                    0%
                </div>

            </div>

        </section>

        <div class="quote">
            — Secure. Fast. Reliable. —
        </div>

        <div
            class="status"
            id="status"
        >
            Initializing SHRF
        </div>

    </main>


    <script>
        const progressBar =
            document.getElementById("progressBar");

        const percentage =
            document.getElementById("percentage");

        const status =
            document.getElementById("status");


        const stages = [
            [10, "Initializing SHRF"],
            [25, "Loading interface"],
            [40, "Preparing modules"],
            [55, "Loading resources"],
            [70, "Connecting services"],
            [85, "Finalizing"],
            [100, "Ready"]
        ];


        let progress = 0;
        let stage = 0;


        function updateLoading() {

            if (progress >= 100) {

                progress = 100;

                progressBar.style.width = "100%";
                percentage.textContent = "100%";

                status.textContent = "Ready";

                return;
            }


            progress += Math.random() * 3 + 0.8;


            if (progress > 100) {
                progress = 100;
            }


            while (
                stage < stages.length - 1 &&
                progress >= stages[stage][0]
            ) {
                stage++;
            }


            progressBar.style.width =
                `${progress}%`;

            percentage.textContent =
                `${Math.floor(progress)}%`;

            status.textContent =
                stages[stage][1];


            setTimeout(
                updateLoading,
                Math.random() * 160 + 100
            );
        }


        updateLoading();
    </script>

</body>
</html>
