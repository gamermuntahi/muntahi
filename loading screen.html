
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHRF — Loading</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080706;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* =========================
           LOADING SCREEN
        ========================= */

        .loading-screen {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            isolation: isolate;
        }

        /* =========================
           BACKGROUND
        ========================= */

        .background {
            position: absolute;
            inset: -40px;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.42),
                    rgba(0, 0, 0, 0.62)
                ),
                url("images/me.png") center / cover no-repeat;

            filter: blur(10px);
            transform: scale(1.06);

            z-index: -3;
        }

        .overlay {
            position: absolute;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 255, 255, 0.025),
                    rgba(0, 0, 0, 0.68)
                );

            z-index: -2;
        }

        /* =========================
           BACKGROUND SHRF TEXT
        ========================= */

        .background-title {
            position: absolute;

            left: -45px;
            top: 50%;

            transform: translateY(-50%);

            font-size: clamp(100px, 16vw, 250px);
            font-weight: 900;

            letter-spacing: -12px;

            color: rgba(255, 247, 230, 0.85);

            filter: blur(5px);

            white-space: nowrap;

            z-index: -1;
            pointer-events: none;
        }

        /* =========================
           MAIN PANEL
        ========================= */

        .loading-panel {
            position: relative;

            width: min(880px, 75vw);
            min-height: 320px;

            margin-top: 45px;

            padding: 100px 50px 55px;

            background: rgba(8, 8, 8, 0.84);

            border: 1px solid rgba(255, 255, 255, 0.035);

            border-radius: 5px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.7),
                inset 0 1px rgba(255, 255, 255, 0.025);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* =========================
           SHRF LOGO
        ========================= */

        .logo-wrapper {
            position: absolute;

            top: -90px;
            left: 50%;

            transform: translateX(-50%);

            width: 145px;
            height: 145px;

            padding: 3px;

            background: rgba(255, 248, 232, 0.82);

            border-radius: 5px;

            box-shadow:
                0 0 35px rgba(255, 235, 190, 0.2),
                0 12px 40px rgba(0, 0, 0, 0.7);

            animation: logoFloat 3s ease-in-out infinite;
        }

        .logo {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: contain;

            background: #111;

            border-radius: 3px;
        }

        @keyframes logoFloat {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }

            50% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /* =========================
           LOADING TEXT
        ========================= */

        .loading-text {
            margin-bottom: 25px;

            color: #eee5d5;

            font-size: 31px;
            font-weight: 300;

            letter-spacing: 12px;

            text-transform: uppercase;

            animation: textPulse 1.8s ease-in-out infinite;
        }

        @keyframes textPulse {
            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           PROGRESS
        ========================= */

        .progress-container {
            width: 100%;
            max-width: 780px;
        }

        .progress-track {
            position: relative;

            width: 100%;
            height: 27px;

            overflow: hidden;

            border: 2px solid rgba(255, 245, 225, 0.2);
            border-radius: 8px;

            background: rgba(0, 0, 0, 0.35);
        }

        .progress-bar {
            position: relative;

            width: 0%;
            height: 100%;

            background: linear-gradient(
                90deg,
                #fff5df,
                #e8ddca
            );

            border-radius: 5px;

            transition: width 0.2s ease;

            box-shadow:
                0 0 14px rgba(255, 245, 225, 0.2);
        }

        .progress-bar::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100px;

            width: 100px;
            height: 100%;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.55),
                transparent
            );

            animation: shine 2s linear infinite;
        }

        @keyframes shine {
            from {
                left: -100px;
            }

            to {
                left: 110%;
            }
        }

        .percentage {
            margin-top: 17px;

            color: #eee4d2;

            text-align: center;

            font-size: 19px;
            font-weight: 300;

            letter-spacing: 5px;
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            position: fixed;

            bottom: 40px;
            left: 50%;

            transform: translateX(-50%);

            color: rgba(255, 245, 225, 0.48);

            font-size: 10px;

            letter-spacing: 2px;

            text-transform: uppercase;

            white-space: nowrap;
        }

        .status::after {
            content: "";

            display: inline-block;

            width: 5px;
            height: 5px;

            margin-left: 7px;

            border-radius: 50%;

            background: #d8cbb6;

            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%,
            100% {
                opacity: 0.15;
            }

            50% {
                opacity: 1;
            }
        }

        /* =========================
           QUOTE
        ========================= */

        .quote {
            position: fixed;

            bottom: 76px;
            left: 50%;

            transform: translateX(-50%);

            color: rgba(255, 245, 225, 0.52);

            font-size: 11px;

            letter-spacing: 5px;

            white-space: nowrap;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .loading-panel {
                width: 88vw;
                min-height: 260px;

                padding: 80px 25px 45px;
            }

            .logo-wrapper {
                width: 115px;
                height: 115px;

                top: -72px;
            }

            .loading-text {
                font-size: 20px;
                letter-spacing: 7px;
            }

            .progress-track {
                height: 21px;
            }

            .percentage {
                font-size: 15px;
            }

            .quote {
                bottom: 65px;

                font-size: 8px;
                letter-spacing: 3px;
            }

            .background-title {
                font-size: 100px;
            }
        }

        @media (max-width: 420px) {

            .loading-panel {
                width: 92vw;
            }

            .loading-text {
                font-size: 17px;
                letter-spacing: 5px;
            }

            .quote {
                display: none;
            }
        }
    </style>
</head>

<body>

    <main class="loading-screen">

        <!-- Background -->
        <div class="background"></div>

        <div class="overlay"></div>

        <!-- Large background branding -->
        <div class="background-title">
            SHRF
        </div>

        <!-- Loading panel -->
        <section class="loading-panel">

            <!-- SHRF logo -->
            <div class="logo-wrapper">
                <img
                    src="images/shrf.jpg"
                    alt="SHRF"
                    class="logo"
                >
            </div>

            <div class="loading-text">
                Loading...
            </div>

            <div class="progress-container">

                <div class="progress-track">
                    <div
                        class="progress-bar"
                        id="progressBar"
                    ></div>
                </div>

                <div
                    class="percentage"
                    id="percentage"
                >
                    0%
                </div>

            </div>

        </section>

        <div class="quote">
            — Secure. Fast. Reliable. —
        </div>

        <div
            class="status"
            id="status"
        >
            Initializing SHRF
        </div>

    </main>


    <script>
        const progressBar =
            document.getElementById("progressBar");

        const percentage =
            document.getElementById("percentage");

        const status =
            document.getElementById("status");


        const stages = [
            [10, "Initializing SHRF"],
            [25, "Loading interface"],
            [40, "Preparing modules"],
            [55, "Loading resources"],
            [70, "Connecting services"],
            [85, "Finalizing"],
            [100, "Ready"]
        ];


        let progress = 0;
        let stage = 0;


        function updateLoading() {

            if (progress >= 100) {

                progress = 100;

                progressBar.style.width = "100%";
                percentage.textContent = "100%";

                status.textContent = "Ready";

                return;
            }


            progress += Math.random() * 3 + 0.8;


            if (progress > 100) {
                progress = 100;
            }


            while (
                stage < stages.length - 1 &&
                progress >= stages[stage][0]
            ) {
                stage++;
            }


            progressBar.style.width =
                `${progress}%`;

            percentage.textContent =
                `${Math.floor(progress)}%`;

            status.textContent =
                stages[stage][1];


            setTimeout(
                updateLoading,
                Math.random() * 160 + 100
            );
        }


        updateLoading();
    </script>

</body>
</html>
